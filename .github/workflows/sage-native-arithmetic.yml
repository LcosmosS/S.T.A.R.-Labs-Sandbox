name: sage-native-arithmetic-opt-in

# Separate, manual and restricted. Not a main/PR gate or scientific review.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sage-native-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Parser and rational Weierstrass self-test only (no Sage, no network)
        run: python3 -I scripts/reproducibility/sage_native_verify.py --self-test

  sage-native-arithmetic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SAGE_IMAGE: sagemath/sagemath@sha256:310dfe23fc786f3a5a06a7b0387c60201ec79b32c0db941b7624505ee5edb565
      ECDATA_URL: https://raw.githubusercontent.com/JohnCremona/ecdata/25cec5ecfec8b9f016eb1631ac633194c2bed39f/allcurves/allcurves.00000-09999
    steps:
      - name: Checkout exact committed verification script (never initialize submodules)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Acquire pinned public ecdata source, record bytes, reject any drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sage-input" "$RUNNER_TEMP/sage-output"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 "$ECDATA_URL" -o "$RUNNER_TEMP/sage-input/allcurves.00000-09999"
          echo "259f3846329395b371e8079c77a6f1097adaebc98a054974573e241416efa968  $RUNNER_TEMP/sage-input/allcurves.00000-09999" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/sage-input/allcurves.00000-09999")" -eq 2146401
          test "$(wc -l < "$RUNNER_TEMP/sage-input/allcurves.00000-09999")" -eq 64687
      - name: Pull exact image digest and capture immutable environment identity
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SAGE_IMAGE"
          docker image inspect "$SAGE_IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/sage-output/image-digests.json"
          echo "$SAGE_IMAGE" > "$RUNNER_TEMP/sage-output/image-reference.txt"
      - name: Execute isolated native conductor/discriminant/j smoke, no internet
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cpus 2 --memory 6g \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOT_SAGE=/tmp/.sage \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/sage-input:/input:ro" \
            -v "$RUNNER_TEMP/sage-output:/output:rw" \
            -w /work "$SAGE_IMAGE" \
            sage -python scripts/reproducibility/sage_native_verify.py \
            --source /input/allcurves.00000-09999 \
            --out /output/native-check.json
          test "$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/sage-output/native-check.json"))["stage"])')" = PASS_NATIVE_ARITHMETIC_SUBSET_ONLY
      - name: Record job identity and digest manifest; never misclassify skipped work
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sage-output"
          {
            echo "repository=LcosmosS/S.T.A.R.-Labs-Sandbox"
            echo "github_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=${{ job.status }}"
          } > "$RUNNER_TEMP/sage-output/job-identity.txt"
          if ! test -s "$RUNNER_TEMP/sage-output/native-check.json"; then
            printf '%s\n' '{"stage":"FAIL_BEFORE_NATIVE_RECEIPT","scientific_support":false,"scope":"sandbox-only","error":"See GitHub run logs for upstream failure"}' > "$RUNNER_TEMP/sage-output/native-check.json"
          fi
          (cd "$RUNNER_TEMP/sage-output"; sha256sum * > SHA256SUMS.txt)
          echo 'Manual native arithmetic-only smoke. PASS here is not Sage notebooks qualified, numerical theory proof, or independent science.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sage-native-arithmetic-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sage-output
          if-no-files-found: error
          retention-days: 30
