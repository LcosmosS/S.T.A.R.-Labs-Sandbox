name: sandbox-policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-policy:
    name: sandbox-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact proposal and archival history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proposal
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out trusted PR base policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: boundary
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out pinned upstream references (read-only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LcosmosS/S.T.A.R.-Labs
          ref: 51927a9b396cdfa880f3128440db4715acdec8dc
          path: upstream-reference
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/
            README.md
            Contributing.md
            LICENSE
            SECURITY.md
            charter/RESEARCH_CHARTER_v0.2.md
            research/gates/ECC_RTCH_RECOVERY.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Check out immutable bootstrap archive verifier
        if: github.event_name == 'pull_request' && github.event.pull_request.base.sha == '22e74794bec8116a019f25bae51ec3f25f62dc6f'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 6b4e234f49e7881eaa1e03943165ab50c39550e4
          path: trusted-archive
          fetch-depth: 1
          sparse-checkout: |
            scripts/verify_archive.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Validate with trusted policy and archive checker
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy_root="$GITHUB_WORKSPACE/proposal"
          archive="$policy_root/scripts/verify_archive.py"
          if [ -n "$PR_BASE_SHA" ]; then
            policy_root="$GITHUB_WORKSPACE/boundary"
            if [ -f "$policy_root/scripts/verify_archive.py" ]; then
              archive="$policy_root/scripts/verify_archive.py"
            else
              # Base commit predates the archive checker: use an immutable,
              # inspected bootstrap verifier, never the PR proposal's copy.
              test "$PR_BASE_SHA" = 22e74794bec8116a019f25bae51ec3f25f62dc6f
              trusted="$GITHUB_WORKSPACE/trusted-archive"
              test "$(git -C "$trusted" rev-parse HEAD)" = 6b4e234f49e7881eaa1e03943165ab50c39550e4
              archive="$trusted/scripts/verify_archive.py"
              test -f "$archive"
              echo 'Archive-check bootstrap: using immutable pinned verifier.'
            fi
          fi
          export POLICY_VALIDATOR="$policy_root/scripts/validate_sandbox.py"
          export PROPOSAL_ROOT="$GITHUB_WORKSPACE/proposal"
          python3 -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("trusted_policy", os.environ["POLICY_VALIDATOR"])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          errors = module.inspect(Path(os.environ["PROPOSAL_ROOT"]))
          for error in errors:
              print("ERROR:", error)
          raise SystemExit(bool(errors))
          PY
          python3 -I "$archive" --root "$PROPOSAL_ROOT" --upstream "$GITHUB_WORKSPACE/upstream-reference"
      - name: Validate proposed policy and test guardrails only
        working-directory: proposal
        run: |
          python3 -I scripts/validate_sandbox.py
          python3 -I -m unittest discover -s tests -p 'test_*.py' -v
