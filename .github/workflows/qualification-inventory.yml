name: sandbox-qualification-inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-inventory-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Verify known optional coverage WITHOUT pretending it executed
        run: |
          python3 -I scripts/reproducibility/qualification_inventory.py --out "$RUNNER_TEMP/qualification-inventory.json"
          python3 -I -m unittest discover -s tests -p 'test_qualification_inventory.py' -v
          echo 'Static inventory only. Every optional suite remains NOT_RUN until independently dispatched and receipted.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sandbox-qualification-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qualification-inventory.json
          if-no-files-found: error
          retention-days: 30
