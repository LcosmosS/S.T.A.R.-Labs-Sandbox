name: sandbox-arithmetic-v3-opt-in

# The P1 arithmetic statistic is research execution, not required PR CI.
# No source or scientific registry mutation, publication, or Legacy promotion.
on:
  pull_request:
    paths:
      - experiments/SBX-2026-0008-arithmetic-pilot-v3/**
      - .github/workflows/sandbox-arithmetic-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-v3-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - name: Check immutable core lock and exact source fixture
        run: |
          python3 -I experiments/SBX-2026-0008-arithmetic-pilot-v3/v3_runner.py --self-test
          python3 -I experiments/SBX-2026-0008-arithmetic-pilot-v3/independent_null.py --self-test

  arithmetic-v3-execute:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_URL: https://raw.githubusercontent.com/JohnCremona/ecdata/25cec5ecfec8b9f016eb1631ac633194c2bed39f/allcurves/allcurves.00000-09999
      SOURCE_SHA256: 259f3846329395b371e8079c77a6f1097adaebc98a054974573e241416efa968
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - name: Exact source byte acquisition and census — no mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-input" "$RUNNER_TEMP/v3-output"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 "$SOURCE_URL" -o "$RUNNER_TEMP/v3-input/ecdata.txt"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/v3-input/ecdata.txt" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/v3-input/ecdata.txt")" -eq 2146401
          test "$(wc -l < "$RUNNER_TEMP/v3-input/ecdata.txt")" -eq 64687
      - name: Canonical prospective v3 arithmetic statistic and 1999 locked null draws
        shell: bash
        run: |
          set -euo pipefail
          python3 -I experiments/SBX-2026-0008-arithmetic-pilot-v3/v3_runner.py \
            --source "$RUNNER_TEMP/v3-input/ecdata.txt" \
            --out "$RUNNER_TEMP/v3-output/canonical"
      - name: Independently recompute all 1999 null draws and all 7 tail counts
        shell: bash
        run: |
          set -euo pipefail
          python3 -I experiments/SBX-2026-0008-arithmetic-pilot-v3/independent_null.py \
            --source "$RUNNER_TEMP/v3-input/ecdata.txt" \
            --canonical "$RUNNER_TEMP/v3-output/canonical" \
            --out "$RUNNER_TEMP/v3-output/independent"
      - name: Fail-closed run receipt, output manifest, and observed status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-output"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"v3-output"
          expected=("canonical/result.json","canonical/null_distribution.csv",
                    "canonical/run_manifest.json","independent/independent_summary.json",
                    "independent/null_distribution_independent.csv",
                    "independent/independent_manifest.json")
          hashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest()
                  for name in expected if (root/name).is_file()}
          complete=len(hashes)==len(expected)
          receipt={
            "schema_version":1,"scope":"sandbox-only",
            "experiment_id":"SBX-2026-0008","job_status":"${{ job.status }}",
            "complete_all_six_artifacts":complete,
            "stage":"OUTPUTS_PRESENT_SUBJECT_TO_JOB_STATUS" if complete
                    else "FAIL_OR_INCOMPLETE",
            "github_commit":os.environ["GITHUB_SHA"],
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "source_sha256":os.environ["SOURCE_SHA256"],
            "artifacts_sha256":hashes,
            "scientific_support":False,
            "physical_observations":0,"legacy_promotion":False,
          }
          (root/"execution_manifest.json").write_text(
             json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          (cd "$RUNNER_TEMP/v3-output"; find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          echo 'The independent software replica is NOT external scientific review or physical inference.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sandbox-v3-arithmetic-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v3-output
          if-no-files-found: error
          retention-days: 30
